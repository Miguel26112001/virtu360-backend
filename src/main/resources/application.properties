# =========================================================
# APPLICATION
# =========================================================
spring.application.name=virtu360

# Active profile resolved from environment variable.
# Example:
#   APP_PROFILE=dev
#   APP_PROFILE=prod
spring.profiles.active=${APP_PROFILE:dev}

# =========================================================
# SERVER
# =========================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/}

# Forward headers support for reverse proxies
server.forward-headers-strategy=framework

# =========================================================
# JACKSON
# =========================================================
spring.jackson.time-zone=${APP_TIMEZONE:UTC}
spring.jackson.serialization.write-dates-as-timestamps=false

# =========================================================
# JPA / HIBERNATE (COMMON CONFIGURATION)
# =========================================================
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:UTC}

# Recommended naming strategy
spring.jpa.hibernate.naming.physical-strategy=com.example.virtu360.shared.infrastructure.documentation.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# =========================================================
# CONNECTION POOL (HIKARI)
# =========================================================
spring.datasource.hikari.pool-name=Virtu360Pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# =========================================================
# API DOCS / SWAGGER
# =========================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# LOGGING (COMMON)
# =========================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.level.root=INFO

# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================================================
# CUSTOM APP VARIABLES
# =========================================================
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}